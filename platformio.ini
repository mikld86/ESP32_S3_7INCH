[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_port = /dev/cu.usbserial-0001
upload_speed = 115200
board_build.partitions = no_ota.csv

build_flags =
    -D LV_CONF_INCLUDE_SIMPLE=1
    -D LV_LVGL_H_INCLUDE_SIMPLE=1
    -D ILI9341_DRIVER=1            ; Change from ILI9341_DRIVER
    -D TFT_WIDTH=320
    -D TFT_HEIGHT=240
    -D TFT_RGB_ORDER=TFT_BGR

    ; --- Explicit Display Pins (CYD / Freenove WROOM Layout) ---
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH

    -D SPI_FREQUENCY=20000000       ; Lowered slightly for stability
    -D SPI_READ_FREQUENCY=20000000
    -D SPI_TOUCH_FREQUENCY=2500000  ; Touch SPI must be much slower
    ; Touch Pins (Required for XPT2046)
    -D TOUCH_CS=33

lib_deps =
    lvgl/lvgl@^8.4
    bodmer/TFT_eSPI@^2.5.43
    https://gitea.sh3d.com.au/Sh3d/VictronBLE.git